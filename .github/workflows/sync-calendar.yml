name: Sync public calendar

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install calendar parser
        run: pip install icalendar recurring-ical-events
      - name: Update calendar data
        run: python scripts/sync_calendar.py
      - name: Commit updated events
        run: |
          if git diff --quiet -- data/events.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git commit -m "Update calendar events"
          git push
